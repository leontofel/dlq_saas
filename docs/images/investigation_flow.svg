<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Browser investigation flow</title>
  <desc id="description">Operator session authentication, tenant authorization, project-scoped investigation, and rendered response.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#22302a" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f4f"/></marker>
    <style>
      .title { font: 700 40px Georgia, serif; fill: #18352c; }
      .subtitle { font: 18px Verdana, sans-serif; fill: #53645d; }
      .lane { font: 700 14px Verdana, sans-serif; letter-spacing: 1px; fill: #315f4f; }
      .name { font: 700 17px Verdana, sans-serif; fill: #17362c; }
      .copy { font: 13px Verdana, sans-serif; fill: #52635c; }
      .edge { fill: none; stroke: #315f4f; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #648078; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="760" fill="#f7f3ea"/>
  <circle cx="1520" cy="40" r="180" fill="#dbe9df" opacity="0.65"/>
  <text x="60" y="70" class="title">Browser investigation</text>
  <text x="62" y="105" class="subtitle">Authentication and tenant scope are resolved before any message query or mutation</text>

  <rect x="55" y="155" width="1490" height="445" rx="30" fill="#fdfcf8" stroke="#b9c9c1"/>
  <text x="85" y="190" class="lane">REQUEST PATH</text>

  <path d="M290 320 H350" class="edge"/>
  <path d="M590 320 H650" class="edge"/>
  <path d="M890 320 H950" class="edge"/>
  <path d="M1190 320 H1250" class="edge"/>
  <path d="M1370 430 V520 H175 V430" class="return"/>

  <g filter="url(#shadow)">
    <rect x="80" y="240" width="210" height="180" rx="22" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="350" y="240" width="240" height="180" rx="22" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="650" y="240" width="240" height="180" rx="22" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="950" y="240" width="240" height="180" rx="22" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="1250" y="240" width="240" height="180" rx="22" fill="#315f4f" stroke="#315f4f" stroke-width="2"/>
  </g>

  <text x="110" y="282" class="name">Operator</text><text x="110" y="319" class="copy">Open inbox or detail</text><text x="110" y="344" class="copy">Change status</text><text x="110" y="369" class="copy">Add note</text>
  <text x="380" y="282" class="name">HTML controller</text><text x="380" y="319" class="copy">Translate request</text><text x="380" y="344" class="copy">Select minimum role</text><text x="380" y="369" class="copy">Render/redirect</text>
  <text x="680" y="282" class="name">RequestIdentity</text><text x="680" y="319" class="copy">Resolve session user</text><text x="680" y="344" class="copy">Require active status</text><text x="680" y="369" class="copy">Return principal</text>
  <text x="980" y="282" class="name">TenantAccess</text><text x="980" y="319" class="copy">Visible organization</text><text x="980" y="344" class="copy">Project membership</text><text x="980" y="369" class="copy">Role threshold</text>
  <text x="1280" y="282" style="font:700 17px Verdana,sans-serif;fill:#ffffff">Investigation</text><text x="1280" y="319" style="font:13px Verdana,sans-serif;fill:#dff0e5">Project-scoped inbox</text><text x="1280" y="344" style="font:13px Verdana,sans-serif;fill:#dff0e5">Attempts + notes</text><text x="1280" y="369" style="font:13px Verdana,sans-serif;fill:#dff0e5">Status mutation</text>

  <rect x="300" y="638" width="1000" height="72" rx="20" fill="#edf6f0" stroke="#2e7d52" stroke-width="2"/>
  <text x="390" y="681" style="font:700 17px Verdana,sans-serif;fill:#17362c">Invariant:</text>
  <text x="485" y="681" class="copy">records are loaded through the authorized project, never by an unscoped global ID</text>
</svg>
