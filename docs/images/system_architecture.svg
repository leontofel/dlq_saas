<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">DLQ as a Service system architecture</title>
  <desc id="description">Implemented Rails control plane, primary business database, framework databases, and planned product capabilities.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#22302a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315f4f"/>
    </marker>
    <marker id="arrow-planned" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c76028"/>
    </marker>
    <style>
      .title { font: 700 42px Georgia, serif; fill: #18352c; }
      .subtitle { font: 18px Verdana, sans-serif; fill: #53645d; }
      .section { font: 700 18px Verdana, sans-serif; letter-spacing: 1px; fill: #315f4f; }
      .box-title { font: 700 17px Verdana, sans-serif; fill: #17362c; }
      .box-copy { font: 14px Verdana, sans-serif; fill: #52635c; }
      .small { font: 12px Verdana, sans-serif; fill: #52635c; }
      .planned-title { font: 700 16px Verdana, sans-serif; fill: #713514; }
      .line { fill: none; stroke: #315f4f; stroke-width: 3; marker-end: url(#arrow); }
      .planned-line { fill: none; stroke: #c76028; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow-planned); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f3ea"/>
  <circle cx="1490" cy="80" r="170" fill="#dbe9df" opacity="0.7"/>
  <circle cx="90" cy="940" r="210" fill="#f2dcc6" opacity="0.65"/>

  <text x="70" y="72" class="title">DLQ Control Plane</text>
  <text x="72" y="106" class="subtitle">Current Rails architecture and the product boundary it protects</text>

  <g transform="translate(1180 55)">
    <rect width="145" height="34" rx="17" fill="#dff0e5" stroke="#2e7d52"/>
    <circle cx="18" cy="17" r="6" fill="#2e7d52"/>
    <text x="32" y="22" class="small">IMPLEMENTED</text>
    <rect x="158" width="128" height="34" rx="17" fill="#fff0dc" stroke="#c76028" stroke-dasharray="5 4"/>
    <circle cx="176" cy="17" r="6" fill="#c76028"/>
    <text x="190" y="22" class="small">PLANNED</text>
  </g>

  <text x="72" y="177" class="section">ACTORS</text>
  <text x="395" y="177" class="section">RAILS CONTROL PLANE</text>
  <text x="1240" y="177" class="section">DATA BOUNDARIES</text>

  <!-- Connectors -->
  <path d="M315 278 H430" class="line"/>
  <path d="M315 542 H430" class="line"/>
  <path d="M1120 300 H1235" class="line"/>
  <path d="M1120 620 H1235" class="line"/>
  <path d="M785 817 V866" class="planned-line"/>

  <!-- Actors -->
  <g filter="url(#shadow)">
    <rect x="70" y="215" width="245" height="126" rx="20" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <circle cx="110" cy="256" r="20" fill="#dff0e5"/>
    <path d="M101 256 h18 M110 247 v18" stroke="#2e7d52" stroke-width="3"/>
    <text x="142" y="255" class="box-title">Client application</text>
    <text x="94" y="295" class="box-copy">HTTP failure producer</text>
    <text x="94" y="319" class="small">Bearer project API key</text>

    <rect x="70" y="479" width="245" height="126" rx="20" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <circle cx="110" cy="520" r="20" fill="#dff0e5"/>
    <circle cx="110" cy="513" r="7" fill="none" stroke="#2e7d52" stroke-width="2"/>
    <path d="M97 532 q13-15 26 0" fill="none" stroke="#2e7d52" stroke-width="2"/>
    <text x="142" y="519" class="box-title">Operator browser</text>
    <text x="94" y="559" class="box-copy">Turbo investigation UI</text>
    <text x="94" y="583" class="small">Authenticated session</text>
  </g>

  <!-- Rails boundary -->
  <rect x="395" y="195" width="725" height="622" rx="28" fill="#fdfcf8" stroke="#315f4f" stroke-width="3" filter="url(#shadow)"/>

  <g>
    <rect x="430" y="235" width="300" height="128" rx="18" fill="#dff0e5" stroke="#2e7d52" stroke-width="2"/>
    <text x="458" y="271" class="box-title">JSON API controllers</text>
    <text x="458" y="301" class="box-copy">API-key ingestion</text>
    <text x="458" y="326" class="small">Thin HTTP translation layer</text>

    <rect x="785" y="235" width="300" height="128" rx="18" fill="#dff0e5" stroke="#2e7d52" stroke-width="2"/>
    <text x="813" y="271" class="box-title">HTML + Turbo controllers</text>
    <text x="813" y="301" class="box-copy">Tenant-scoped operations</text>
    <text x="813" y="326" class="small">Server-rendered product UI</text>

    <rect x="430" y="395" width="300" height="128" rx="18" fill="#edf6f0" stroke="#2e7d52" stroke-width="2"/>
    <text x="458" y="431" class="box-title">RequestIdentity</text>
    <text x="458" y="461" class="box-copy">Session, JWT, API key</text>
    <text x="458" y="486" class="small">Returns one principal shape</text>

    <rect x="785" y="395" width="300" height="128" rx="18" fill="#edf6f0" stroke="#2e7d52" stroke-width="2"/>
    <text x="813" y="431" class="box-title">TenantAccess</text>
    <text x="813" y="461" class="box-copy">Organization + project scope</text>
    <text x="813" y="486" class="small">Role threshold enforcement</text>

    <rect x="430" y="555" width="300" height="128" rx="18" fill="#edf6f0" stroke="#2e7d52" stroke-width="2"/>
    <text x="458" y="591" class="box-title">FailedMessages::Intake</text>
    <text x="458" y="621" class="box-copy">Validate, redact, deduplicate</text>
    <text x="458" y="646" class="small">Transactional persistence</text>

    <rect x="785" y="555" width="300" height="128" rx="18" fill="#edf6f0" stroke="#2e7d52" stroke-width="2"/>
    <text x="813" y="591" class="box-title">Investigation</text>
    <text x="813" y="621" class="box-copy">Inbox, detail, status, notes</text>
    <text x="813" y="646" class="small">Project-scoped query boundary</text>

    <rect x="545" y="715" width="425" height="72" rx="18" fill="#315f4f"/>
    <text x="618" y="747" style="font:700 18px Verdana,sans-serif;fill:#ffffff">Active Record domain models</text>
    <text x="652" y="771" style="font:13px Verdana,sans-serif;fill:#dff0e5">Business invariants + persistence</text>
  </g>

  <!-- Data boundaries -->
  <g filter="url(#shadow)">
    <rect x="1235" y="215" width="290" height="170" rx="22" fill="#ffffff" stroke="#2e7d52" stroke-width="3"/>
    <ellipse cx="1380" cy="255" rx="78" ry="20" fill="#dff0e5" stroke="#2e7d52" stroke-width="2"/>
    <path d="M1302 255 v72 c0 11 35 20 78 20 s78-9 78-20 v-72" fill="#dff0e5" stroke="#2e7d52" stroke-width="2"/>
    <text x="1318" y="304" class="box-title">Primary database</text>
    <text x="1327" y="331" class="small">DLQ business state</text>
    <text x="1337" y="363" class="small">SQLite-first</text>

    <rect x="1235" y="455" width="290" height="257" rx="22" fill="#e7f0f7" stroke="#2e6486" stroke-width="2"/>
    <text x="1270" y="493" class="box-title">Rails support databases</text>
    <rect x="1270" y="520" width="220" height="45" rx="12" fill="#ffffff" stroke="#2e6486"/>
    <text x="1326" y="549" class="box-copy">Solid Queue</text>
    <rect x="1270" y="578" width="220" height="45" rx="12" fill="#ffffff" stroke="#2e6486"/>
    <text x="1326" y="607" class="box-copy">Solid Cache</text>
    <rect x="1270" y="636" width="220" height="45" rx="12" fill="#ffffff" stroke="#2e6486"/>
    <text x="1326" y="665" class="box-copy">Solid Cable</text>
    <text x="1286" y="698" class="small">No DLQ business state</text>
  </g>

  <!-- Roadmap -->
  <rect x="395" y="866" width="1130" height="96" rx="22" fill="#fff0dc" stroke="#c76028" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="430" y="905" class="planned-title">NEXT PRODUCT LAYERS</text>
  <rect x="690" y="890" width="210" height="46" rx="14" fill="#ffffff" stroke="#c76028"/>
  <text x="727" y="919" class="planned-title">Incident grouping</text>
  <rect x="930" y="890" width="210" height="46" rx="14" fill="#ffffff" stroke="#c76028"/>
  <text x="973" y="919" class="planned-title">Controlled replay</text>
  <rect x="1170" y="890" width="285" height="46" rx="14" fill="#ffffff" stroke="#c76028"/>
  <text x="1213" y="919" class="planned-title">Alerts + auditability</text>
</svg>
