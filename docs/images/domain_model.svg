<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title description">
  <title id="title">DLQ as a Service domain model</title>
  <desc id="description">Implemented tenant and ingestion entities plus scaffolded incident, replay, alert, and audit entities.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#22302a" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f4f"/></marker>
    <marker id="planned-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c76028"/></marker>
    <style>
      .title { font: 700 42px Georgia, serif; fill: #18352c; }
      .subtitle { font: 18px Verdana, sans-serif; fill: #53645d; }
      .lane { font: 700 15px Verdana, sans-serif; letter-spacing: 1px; fill: #315f4f; }
      .name { font: 700 17px Verdana, sans-serif; fill: #17362c; }
      .field { font: 13px 'Courier New', monospace; fill: #52635c; }
      .planned-name { font: 700 16px Verdana, sans-serif; fill: #713514; }
      .edge { fill: none; stroke: #315f4f; stroke-width: 3; marker-end: url(#arrow); }
      .planned { fill: none; stroke: #c76028; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#planned-arrow); }
      .edge-label { font: 12px Verdana, sans-serif; fill: #52635c; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#f7f3ea"/>
  <circle cx="1700" cy="60" r="210" fill="#dbe9df" opacity="0.65"/>
  <circle cx="50" cy="1160" r="250" fill="#f2dcc6" opacity="0.6"/>
  <text x="60" y="68" class="title">Domain Model</text>
  <text x="62" y="102" class="subtitle">Solid lines are implemented behavior; dashed lines are roadmap scaffolding</text>

  <rect x="55" y="145" width="1690" height="230" rx="28" fill="#edf6f0" stroke="#9abaaa"/>
  <text x="82" y="178" class="lane">TENANT AND ACCESS</text>
  <rect x="55" y="410" width="1690" height="405" rx="28" fill="#fdfcf8" stroke="#9abaaa"/>
  <text x="82" y="443" class="lane">INGESTION AND INVESTIGATION</text>
  <rect x="55" y="850" width="1690" height="290" rx="28" fill="#fff0dc" stroke="#c76028" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="82" y="883" style="font:700 15px Verdana,sans-serif;letter-spacing:1px;fill:#9b461b">NEXT AND SCAFFOLDED MODELS</text>

  <!-- Implemented relation paths -->
  <path d="M310 270 H405" class="edge"/>
  <path d="M680 270 H775" class="edge"/>
  <path d="M1050 270 H1145" class="edge"/>
  <path d="M1290 375 V490" class="edge"/>
  <path d="M1290 375 V440 H315 V490" class="edge"/>
  <path d="M1290 375 V460 H650 V490" class="edge"/>
  <path d="M1290 375 V475 H985 V490" class="edge"/>
  <path d="M650 606 V640 H1175" class="edge"/>
  <path d="M1175 650 H1145 V800 H407 V781" class="edge"/>
  <path d="M1175 700 H1160 V810 H757 V781" class="edge"/>
  <path d="M960 760 H905" class="edge"/>

  <!-- Planned relation paths -->
  <path d="M1290 815 V910 H280 V930" class="planned"/>
  <path d="M1290 815 V900 H610 V930" class="planned"/>
  <path d="M1290 815 V890 H940 V930" class="planned"/>

  <!-- Tenant cards -->
  <g filter="url(#shadow)">
    <rect x="95" y="205" width="215" height="130" rx="18" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="405" y="205" width="275" height="130" rx="18" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="775" y="205" width="275" height="130" rx="18" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="1145" y="205" width="290" height="170" rx="18" fill="#315f4f" stroke="#315f4f" stroke-width="2"/>
  </g>
  <text x="125" y="242" class="name">User</text><text x="125" y="274" class="field">email</text><text x="125" y="298" class="field">password_digest</text><text x="125" y="322" class="field">status</text>
  <text x="435" y="242" class="name">OrganizationMembership</text><text x="435" y="274" class="field">user_id</text><text x="435" y="298" class="field">organization_id</text><text x="435" y="322" class="field">role</text>
  <text x="805" y="242" class="name">Organization</text><text x="805" y="274" class="field">slug</text><text x="805" y="298" class="field">status</text>
  <text x="1178" y="244" style="font:700 20px Verdana,sans-serif;fill:#ffffff">Project</text><text x="1178" y="281" style="font:13px 'Courier New',monospace;fill:#dff0e5">organization_id</text><text x="1178" y="305" style="font:13px 'Courier New',monospace;fill:#dff0e5">environment</text><text x="1178" y="329" style="font:13px 'Courier New',monospace;fill:#dff0e5">payload + retention policy</text><text x="1178" y="353" style="font:12px Verdana,sans-serif;fill:#ffffff">OPERATIONAL TENANT</text>

  <!-- Ingestion cards -->
  <g filter="url(#shadow)">
    <rect x="170" y="490" width="290" height="116" rx="18" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="505" y="490" width="290" height="116" rx="18" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="840" y="490" width="290" height="116" rx="18" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="1175" y="490" width="300" height="316" rx="20" fill="#ffffff" stroke="#2e7d52" stroke-width="3"/>
    <rect x="260" y="665" width="295" height="116" rx="18" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="610" y="665" width="295" height="116" rx="18" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <rect x="960" y="665" width="170" height="116" rx="18" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
  </g>
  <text x="200" y="527" class="name">ProjectApiKey</text><text x="200" y="557" class="field">key_digest</text><text x="200" y="581" class="field">scopes</text>
  <text x="535" y="527" class="name">Source</text><text x="535" y="557" class="field">slug</text><text x="535" y="581" class="field">status</text>
  <text x="870" y="527" class="name">RedactionRule</text><text x="870" y="557" class="field">json_path</text><text x="870" y="581" class="field">replacement</text>
  <text x="1207" y="530" class="name">FailedMessage</text><text x="1207" y="566" class="field">project_id + source_id</text><text x="1207" y="592" class="field">dedup_identity_key</text><text x="1207" y="618" class="field">fingerprint</text><text x="1207" y="644" class="field">status + attempt_count</text><text x="1207" y="670" class="field">payload_original_text</text><text x="1207" y="696" class="field">latest failure summary</text><line x1="1207" y1="720" x2="1442" y2="720" stroke="#d4ded8"/><text x="1207" y="748" class="edge-label">Inbox query aggregate</text><text x="1207" y="774" class="edge-label">Original payload stays immutable</text>
  <text x="290" y="702" class="name">FailureAttempt</text><text x="290" y="732" class="field">attempt_number</text><text x="290" y="756" class="field">error + occurred_at</text>
  <text x="640" y="702" class="name">MessageNote</text><text x="640" y="732" class="field">author_user_id</text><text x="640" y="756" class="field">body</text>
  <text x="988" y="702" class="name">User</text><text x="988" y="735" class="edge-label">authors notes</text>

  <!-- Roadmap cards -->
  <g filter="url(#shadow)">
    <rect x="140" y="930" width="280" height="150" rx="18" fill="#ffffff" stroke="#c76028" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="470" y="930" width="280" height="150" rx="18" fill="#ffffff" stroke="#c76028" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="800" y="930" width="280" height="150" rx="18" fill="#ffffff" stroke="#c76028" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="1130" y="930" width="280" height="150" rx="18" fill="#ffffff" stroke="#c76028" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="1460" y="930" width="230" height="150" rx="18" fill="#ffffff" stroke="#c76028" stroke-width="2" stroke-dasharray="7 5"/>
  </g>
  <text x="170" y="968" class="planned-name">IncidentGroup</text><text x="170" y="999" class="field">project + fingerprint</text><text x="170" y="1025" class="field">counts + status</text><text x="170" y="1054" class="edge-label">NEXT: Sprint 3</text>
  <text x="500" y="968" class="planned-name">PayloadVersion</text><text x="500" y="999" class="field">failed_message_id</text><text x="500" y="1025" class="field">version_number</text><text x="500" y="1054" class="edge-label">Edited replay copy</text>
  <text x="830" y="968" class="planned-name">Replay</text><text x="830" y="999" class="field">destination</text><text x="830" y="1025" class="field">batch + attempts</text><text x="830" y="1054" class="edge-label">Controlled delivery</text>
  <text x="1160" y="968" class="planned-name">Alerts</text><text x="1160" y="999" class="field">rule + delivery</text><text x="1160" y="1025" class="field">email + webhook</text><text x="1160" y="1054" class="edge-label">Retry + deduplication</text>
  <text x="1490" y="968" class="planned-name">AuditEvent</text><text x="1490" y="999" class="field">organization_id</text><text x="1490" y="1025" class="field">actor + target</text><text x="1490" y="1054" class="edge-label">Append-only history</text>
</svg>
